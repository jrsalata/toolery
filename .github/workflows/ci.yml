name: CI

# Gates every PR against main and every push to main: formatting, static
# analysis, and the test suite. Nothing here builds an APK/AAB -- gradlew is
# gitignored and android/settings.gradle.kts reads local.properties
# unguarded, so a Gradle-direct step would fail without extra setup that
# isn't needed for a check-only workflow.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  # Catches what an ubuntu runner cannot: a pod that will not resolve at the
  # deployment target, a plist key that breaks the build, a plugin that lost
  # iOS support. macOS runners bill at 10x, so this runs on pull requests
  # only -- pushes to main have already passed it on the PR.
  ios-build:
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --no-codesign avoids needing certificates in CI.
      - name: Build iOS (simulator, unsigned)
        run: flutter build ios --no-codesign --simulator

  # Drives the real app on a real Android runtime -- the only place the
  # SQLite path, shared_preferences, and the tab shell get exercised end to
  # end (see integration_test/). needs: test so a lint/format failure never
  # burns the 15-30 minutes an emulator run costs. Non-blocking on purpose:
  # emulator jobs flake for reasons that have nothing to do with the diff,
  # so a red X here should inform, not gate.
  android-emulator:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ubuntu-latest ships KVM but not the permissions to use it; without
      # this the emulator falls back to software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot."

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell pm clear software.salata.toolery.debug || true
            flutter test integration_test --reporter expanded
